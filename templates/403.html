<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f7f5f2;
            --surface: #ffffff;
            --surface-hover: #faf9f7;
            --border: rgba(0,0,0,0.06);
            --text: #1a1a2e;
            --text-muted: #8a8a9e;
            --accent: #b8942e;
            --accent-hover: #a07e20;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
            --card-bg: var(--surface);
            --card-backdrop: none;
        }

        [data-theme="dark"] {
            --bg: #0d0d1a;
            --surface: #16162a;
            --surface-hover: #1e1e36;
            --border: rgba(255,255,255,0.06);
            --text: #e8e6e3;
            --text-muted: #7a7a8e;
            --accent: #c9a96e;
            --accent-hover: #dfc088;
            --danger: #e05252;
            --danger-bg: rgba(224,82,82,0.1);
            --success: #4ade80;
            --success-bg: rgba(74,222,128,0.1);
            --card-shadow: 0 20px 40px rgba(0,0,0,0.3);
            --card-bg: rgba(22,22,42,0.8);
            --card-backdrop: blur(20px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.01em;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            letter-spacing: -0.02em;
        }

        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background-color: var(--surface-hover);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .error-card {
            background: var(--card-bg);
            backdrop-filter: var(--card-backdrop);
            -webkit-backdrop-filter: var(--card-backdrop);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--card-shadow);
            animation: fadeInUp 0.6s ease forwards;
            text-align: center;
        }

        .shield-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            color: var(--danger);
            animation: pulse 2s infinite ease-in-out;
        }

        .shield-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .description {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: var(--danger-bg);
            border-radius: 8px;
            border: 1px solid rgba(220, 38, 38, 0.2);
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        button.primary {
            padding: 0.875rem 2rem;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        /* Icons for toggle */
        #sun-icon { display: none; }
        [data-theme="dark"] #sun-icon { display: block; }
        [data-theme="dark"] #moon-icon { display: none; }
    </style>
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg id="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <div class="error-card">
        <div class="shield-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1 class="title">403 — Access Denied</h1>
        <div class="description">
            {{ description }}
        </div>
        <button class="primary" onclick="javascript:history.back()">Go Back</button>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('todo_theme');
        
        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        themeToggleBtn.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('todo_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('todo_theme', 'dark');
            }
        });
    </script>
</body>
</html>
